name: Integrate source-aligned Fraud Journey

on:
  push:
    branches:
      - feature/source-aligned-fraud-report

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-aligned-fraud-report
          fetch-depth: 0
      - name: Apply reviewed integration payload
        shell: bash
        run: |
          cat > /tmp/cointr_payload.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/cointr_payload.b64 > /tmp/cointr_payload.tar.gz
          tar -xzf /tmp/cointr_payload.tar.gz -C .
          rm -f .github/workflows/tmp_coamc_job_lookup.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add README.md configs docs scripts src tests .github/workflows/ci.yml
          git add -u .github/workflows/tmp_coamc_job_lookup.yml || true
          git commit -m "feat: add source-aligned Fraud Journey report and controls"
          git push origin HEAD:feature/source-aligned-fraud-report
